[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifiably-autonomy"
version = "0.1.0"
description = "The envelope of verifiably: what may run unattended."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autonomy = "autonomy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-testmon>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bwrap: needs bubblewrap and unprivileged user namespaces"]

# Pyright reads this when resolving imports from files under python/: the venv
# holds the package itself (uv sync installs it editable), and tests/ holds the
# sibling helpers (channels.py, builders.py, …) its test modules import.
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]

[tool.uv]
# The sandbox needs os.pidfd_open and signal.pidfd_send_signal (envelope design §8);
# uv's managed CPython builds omit both, so the environment uses the system interpreter.
python-preference = "system"
